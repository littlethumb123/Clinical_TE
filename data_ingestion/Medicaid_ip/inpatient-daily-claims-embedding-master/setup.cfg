[metadata]
name = ecp-ip-transformer
#version = 1
author = Jane Zou
author_email = zouj@aetna.com
maintainer = Alexander Esterkin
maintainer_email = esterkina@aetna.com
description = PyTorch based In-Patient Transformer Model
#long_description = #file: README.rst, CHANGELOG.rst, LICENSE.rst
#keywords = one, two
#license = BSD-3-Clause
classifiers =
    Framework :: PyTorch
    Programming Language :: Python :: 3

[options]
dependency_links=['https://repo-man.aetna.com/nexus/repository/ae-pypi-proxy/simple/', 'https://pypi.org/simple'],
zip_safe = False
include_package_data = True
packages = find:
python_requires = >=3.10
install_requires =
    requests
    importlib-metadata
    python_version>="3.10"
    google-cloud-bigquery
    torch
    numba
    rapidsai
    cudf
    nvidia-smi
    pytest
    scikit-learn
    xgboost
    catboost
    nvidia-ml-py
    mkl
    apache-airflow-providers-google
    holoviews
[options.package_data]
* = *.txt, *.rst
hello = *.msg

[options.entry_points]
console_scripts =
    executable-name = cp-ip-transformer.module:run

[options.extras_require]
test=
    pytest
#pdf = ReportLab>=1.2; RXP
#rest = docutils>=0.3; pack ==1.1, ==1.3

[options.packages.find]
exclude =
#    new_ds_onprem*
    tools*
    docs*
